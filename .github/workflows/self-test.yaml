name: self-test

# Byte-compile + action.yaml parse, plus the fixture tests in tests/
# (stdlib unittest, no deps). The fixture tests are what say the linter
# works; the first two steps only catch syntax/metadata breakage.
on:
  pull_request:
    paths:
      - 'action.yaml'
      - 'lint_pipeline_async.py'
      - 'tests/**'
      - '.github/workflows/self-test.yaml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Byte-compile
        run: python3 -m py_compile lint_pipeline_async.py
      - name: Action metadata parses
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 -c "
          import yaml, sys
          d = yaml.safe_load(open('action.yaml'))
          assert d.get('runs'), 'action.yaml has no runs: block'
          print('SYNTAX-CHECK-COMPLETE — action.yaml valid, script compiles')
          "
      - name: Fixture tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee test.log
          grep -q '^OK' test.log
          echo 'FIXTURE-TESTS-COMPLETE'
